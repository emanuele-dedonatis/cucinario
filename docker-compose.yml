services:
  cucinario:
    build: .
    image: cucinario
    container_name: cucinario
    restart: unless-stopped
    ports:
      # solo locale: da fuori si passa dal reverse proxy nginx (repo infra) che fa HTTPS.
      # 8091 perché la 8090 è di ChirpStack; nginx (repo infra) la pubblica su https://cucinario.ededona.es
      - "127.0.0.1:8091:8090"
    volumes:
      # database SQLite, foto caricate e backup automatici
      - ./pb_data:/pb/pb_data
    environment:
      - TZ=Europe/Rome
