<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cucinario</title>
<meta name="description" content="Pranzi e cene di casa: settimana, spesa e ricette.">
<meta name="theme-color" content="#f3f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cucinario">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="login" id="login" hidden>
  <form class="wrap" id="loginForm">
    <img src="icons/icon.svg" alt="" width="72" height="72">
    <h1>Cucinario</h1>
    <p>Pranzi e cene di casa</p>
    <label>Email<input class="txt" type="email" id="lEmail" autocomplete="username" required></label>
    <label>Password<input class="txt" type="password" id="lPass" autocomplete="current-password" required></label>
    <p class="lerr" id="lErr" hidden></p>
    <button class="btn" type="submit">Entra</button>
  </form>
</div>

<div id="app" hidden>
<header>
  <div class="wrap">
    <div class="top" id="topRow">
      <h1 id="title">Settimana</h1>
    </div>
    <div class="weeknav" id="weeknav">
      <button class="iconbtn" id="prev" aria-label="Settimana precedente">‹</button>
      <button class="lbl" id="weeklbl" aria-label="Torna a oggi"></button>
      <button class="iconbtn" id="next" aria-label="Settimana successiva">›</button>
      <button class="btn" id="autoBtn">✦ Riempi</button>
    </div>
    <button class="goals" id="goals" aria-label="Obiettivi della settimana, tocca per modificarli"></button>
    <p class="sync" id="sync" role="status" hidden></p>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="v-week">
      <div class="days" id="days"></div>
    </section>

    <section id="v-shop" hidden>
      <div class="seg" id="shopMode" role="group" aria-label="Modalità lista">
        <button data-mode="casa" aria-pressed="true">Controllo a casa</button>
        <button data-mode="mercato" aria-pressed="false">Al mercato</button>
      </div>
      <div class="sh-head">
        <p id="shopSummary"></p>
        <button class="btn ghost" id="resetChecks">Azzera spunte</button>
      </div>
      <div class="progress"><span id="prog"></span></div>
      <div id="shop"></div>
    </section>

    <section id="v-rec" hidden>
      <div class="filters" id="recFilters"></div>
      <div class="rlist" id="recList"></div>
    </section>

    <section id="v-set" hidden>
      <div class="setlist" id="setList"></div>
    </section>
  </div>
</main>

<nav class="tabs" role="tablist">
  <div class="wrap">
    <button role="tab" data-tab="week" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Settimana</button>
    <button role="tab" data-tab="shop" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 11a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Spesa</button>
    <button role="tab" data-tab="rec" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Ricette</button>
    <button role="tab" data-tab="set" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Impostazioni</button>
  </div>
</nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="wrap sheet-head"><h2 id="sheetTitle"></h2><button class="iconbtn" id="closeSheet" aria-label="Chiudi">✕</button></div>
  <div class="wrap sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="vendor/pocketbase.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
